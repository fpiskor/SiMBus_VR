<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D3B66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SiMBus">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230D3B66'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='700' fill='%23F4A300' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<title>SiMBus — Vozni red</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#16224B;
    --blue-800:#1C2F63;
    --blue-700:#2B4A8C;
    --amber:#D9A62E;
    --amber-dark:#B8871C;
    --green:#3AA43D;
    --green-dark:#2F8A32;
    --red:#B3261E;
    --bg:#EEF1F5;
    --surface:#FFFFFF;
    --ink:#12212E;
    --muted:#5C6B7A;
    --line:#DDE3EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    box-shadow:0 0 40px rgba(13,59,102,0.12);
    overflow-x:hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(135deg, #234070, var(--blue-900) 65%);
    color:#fff;
    padding:18px 18px 16px;
    position:sticky;
    top:0;
    z-index:40;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .brand-mark{
    width:6px;height:26px;
    border-radius:3px;
    background:var(--amber);
    flex-shrink:0;
  }
  .brand-name{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:21px;
    letter-spacing:0.2px;
  }
  .brand-name .sim{color:#fff;}
  .brand-name .bus{color:#5CC65E;}
  .brand-sub{
    font-size:11px;
    color:#B9CBDE;
    margin-top:-2px;
    letter-spacing:0.4px;
    text-transform:uppercase;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:10px;
    padding:11px 14px 11px 38px;
    color:#fff;
    font-size:14.5px;
    font-family:'Inter',sans-serif;
    outline:none;
  }
  .search-wrap input::placeholder{color:#B9CBDE;}
  .search-wrap svg{
    position:absolute;left:12px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:#B9CBDE;
  }
  .live-clock{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    color:#B9CBDE;
    margin-left:auto;
    flex-shrink:0;
  }
  .live-clock .dot{width:5px;height:5px;}
  .brand{justify-content:space-between;}

  /* ---------- Line list ---------- */
  .section-label{
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:var(--muted);
    padding:18px 18px 8px;
  }
  .line-list{
    padding:0 14px 24px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .line-card{
    background:var(--surface);
    border-radius:var(--radius);
    padding:13px 14px;
    display:flex;
    align-items:center;
    gap:13px;
    cursor:pointer;
    border:1px solid var(--line);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .line-card:active{transform:scale(0.98);}
  .line-badge{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:17px;
    color:#fff;
    background:var(--blue-900);
    min-width:46px;
    height:40px;
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .line-info{flex:1;min-width:0;}
  .line-route{
    font-weight:600;
    font-size:14.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .line-meta{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .line-next{
    text-align:right;
    flex-shrink:0;
  }
  .line-next .lbl{
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:var(--muted);
    display:block;
  }
  .line-next .val{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:14px;
    color:var(--green);
  }
  .line-next .val.off{color:var(--muted);}

  /* ---------- Detail view ---------- */
  #detail{display:none;}
  .backbtn{
    display:flex;align-items:center;gap:6px;
    color:#fff;
    font-size:13.5px;
    font-weight:500;
    margin-bottom:12px;
    cursor:pointer;
    width:fit-content;
  }
  .backbtn svg{width:16px;height:16px;stroke:#fff;}

  .detail-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .detail-badge{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:22px;
    background:var(--amber);
    color:var(--blue-900);
    min-width:56px;height:48px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    transform:skewX(-6deg);
    flex-shrink:0;
  }
  .detail-badge span{transform:skewX(6deg);}
  .detail-title{
    font-family:'Oswald',sans-serif;
    font-size:17px;
    font-weight:600;
    line-height:1.2;
  }
  .detail-title small{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:#B9CBDE;
    font-weight:400;
    margin-top:2px;
    letter-spacing:0.3px;
  }

  /* split flap live card */
  .live-card{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .live-left .lbl{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#B9CBDE;
    display:flex;align-items:center;gap:5px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--amber);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(244,163,0,0.55);}
    70%{box-shadow:0 0 0 7px rgba(244,163,0,0);}
    100%{box-shadow:0 0 0 0 rgba(244,163,0,0);}
  }
  .live-left .desc{
    font-size:12.5px;
    color:#fff;
    margin-top:3px;
    max-width:170px;
  }
  .flap-row{display:flex;gap:3px;}
  .flap{
    background:#0A2A49;
    border-radius:5px;
    width:26px;height:34px;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:19px;
    color:var(--amber);
    position:relative;
    box-shadow:inset 0 -1px 0 rgba(255,255,255,0.08);
  }
  .flap::after{
    content:'';
    position:absolute;left:0;right:0;top:50%;
    height:1px;background:rgba(0,0,0,0.45);
  }
  .flap.colon{
    background:transparent;
    width:8px;
    color:var(--amber);
  }
  .flap.colon::after{display:none;}

  /* tabs */
  .tabs{
    display:flex;
    background:var(--surface);
    margin:16px 16px 0;
    border-radius:11px;
    padding:4px;
    border:1px solid var(--line);
  }  .tab{
    flex:1;
    text-align:center;
    padding:9px 6px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    border-radius:8px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--blue-900);
    color:#fff;
  }

  .date-select{
    margin:10px 16px 0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 13px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .date-select label{
    font-size:12px;
    font-weight:600;
    color:var(--muted);
  }
  .date-select input[type="date"]{
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink);
    background:#F7F9FA;
  }
  .weekday-label{
    margin-left:auto;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:var(--muted);
    padding:3px 9px;
    border-radius:20px;
    background:#EDEFF2;
  }
  .weekday-label.is-today{
    color:var(--green);
    background:#E7F3E8;
  }

  .daybar{
    margin:12px 16px 0;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .day-chip{
    font-size:11.5px;
    font-weight:600;
    padding:5px 10px;
    border-radius:20px;
    background:#fff;
    border:1px solid var(--line);
    color:var(--muted);
  }
  .day-chip.today{
    background:#E7F3E8;
    border-color:#BFE0C2;
    color:var(--green);
  }

  /* departure list (shown first when a line is opened) */
  .run-list{
    padding:16px 16px 28px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .run-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    border-left:3px solid transparent;
    transition:transform .12s ease;
  }
  .run-card:active{transform:scale(0.98);}
  .run-card.today{border-left-color:var(--amber);}
  .run-time-badge{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:19px;
    color:var(--blue-900);
    min-width:60px;
  }
  .run-info{flex:1;min-width:0;}
  .run-route{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .run-meta{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:4px;
    flex-wrap:wrap;
  }
  .run-days-label{
    font-size:11.5px;
    color:var(--muted);
  }
  .run-today-chip{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--green);
    background:#E7F3E8;
    border-radius:20px;
    padding:2px 8px;
    text-transform:uppercase;
  }
  .run-today-chip.off{
    color:var(--muted);
    background:#EDEFF2;
  }
  .run-arrow{
    flex-shrink:0;
    width:18px;height:18px;
    stroke:#B9C4CF;
  }
  .run-list-head{
    padding:16px 16px 0;
    font-size:12px;
    color:var(--muted);
  }

  /* single-run detail: back link + summary */
  .run-detail-head{
    padding:14px 16px 0;
  }
  .run-back{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:13px;
    font-weight:600;
    color:var(--blue-700);
    cursor:pointer;
    width:fit-content;
    margin-bottom:10px;
  }
  .run-back svg{width:14px;height:14px;stroke:var(--blue-700);}
  .run-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .run-summary-title{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--blue-900);
  }

  /* route panel */
  .route-panel{
    margin:14px 16px 28px;
    background:var(--surface);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
  }
  .route-panel-head{
    padding:12px 16px 10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .route-panel-head h3{
    margin:0;
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--blue-900);
  }
  .route-panel-head span{
    font-size:11.5px;
    color:var(--muted);
  }

  .route-body{
    display:flex;
    padding:14px 10px 16px 0;
  }
  .rail-col{
    width:34px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    padding-top:6px;
  }
  .rail-line{
    position:absolute;
    top:14px;bottom:22px;
    width:3px;
    background:var(--line);
    border-radius:2px;
  }
  .rail-line.active-track{background:var(--blue-700);}
  .stop-dot{
    width:11px;height:11px;
    border-radius:50%;
    background:#fff;
    border:3px solid var(--blue-700);
    z-index:2;
    margin-bottom:0;
    flex-shrink:0;
  }
  .stop-dot.dim{border-color:#B9C4CF;}
  .stop-dot.next{
    border-color:var(--amber);
    box-shadow:0 0 0 4px rgba(244,163,0,0.22);
  }
  .bus-marker{
    position:absolute;
    left:50%;
    top:6px;
    transform:translate(-50%,-50%);
    width:20px;height:20px;
    border-radius:50%;
    background:var(--amber);
    border:2px solid #fff;
    box-shadow:0 0 0 3px rgba(244,163,0,0.28), 0 2px 5px rgba(13,59,102,0.35);
    z-index:4;
    display:flex;align-items:center;justify-content:center;
    transition:top 1s linear;
  }
  .bus-marker svg{width:11px;height:11px;fill:var(--blue-900);}
  .stop-row{
    display:flex;
    align-items:center;
    min-height:52px;
  }
  .stop-name-col{
    flex:1;
    min-width:0;
    padding-right:8px;
  }
  .stop-name{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    line-height:1.25;
  }
  .stop-name.endpoint{color:var(--blue-900);}
  .stop-km{
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
    margin-top:1px;
  }
  .stop-note{
    font-size:11px;
    color:#8A5A00;
    font-weight:700;
    margin-top:2px;
  }
  .no-service-reason{
    display:block;
    margin-top:3px;
    font-weight:700;
  }
  .no-service-next{
    display:block;
    margin-top:5px;
    color:#5E4B17;
    font-weight:500;
  }
  .stop-times{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .time-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    min-width:48px;
    text-align:center;
    padding:5px 4px;
    border-radius:7px;
    background:#F1F4F7;
    color:var(--ink);
  }
  .time-chip.dash{
    color:#C3CBD3;
    background:transparent;
  }
  .time-chip.highlight{
    background:var(--amber);
    color:var(--blue-900);
  }
  .time-chip.past{
    opacity:0.4;
  }

  .col-headers{
    display:flex;
    gap:6px;
    padding-left:0;
    justify-content:flex-end;
  }
  .col-head{
    min-width:48px;
    text-align:center;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:0.4px;
    color:var(--muted);
    text-transform:uppercase;
  }

  .demo-tag{
    color:var(--red);
    font-weight:700;
    letter-spacing:0.4px;
    font-size:10px;
  }
  .demo-banner{
    margin:12px 16px 0;
    background:#FBEAEA;
    border:1px solid #F0C6C6;
    color:#8A2A24;
    font-size:12px;
    line-height:1.5;
    border-radius:10px;
    padding:10px 13px;
  }
  .no-service-banner{
    margin:12px 16px 0;
    background:#FDF3E3;
    border:1px solid #F0DDB2;
    color:#7A5C10;
    font-size:12.5px;
    font-weight:600;
    line-height:1.5;
    border-radius:10px;
    padding:10px 13px;
  }
  .empty-state{
    padding:60px 30px;
    text-align:center;
    color:var(--muted);
  }
  .empty-state svg{width:40px;height:40px;stroke:#B9C4CF;margin-bottom:10px;}
  .empty-state p{font-size:13.5px;margin:0;}
  .empty-state.error-state svg{stroke:var(--red);}
  .empty-state.error-state p{color:var(--red);font-weight:700;font-size:14.5px;}

  .footer-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding:0 30px 26px;
    line-height:1.5;
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== LIST VIEW ===================== -->
  <div id="list-view">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name"><span class="sim">SiM</span><span class="bus">Bus</span></div>
          <div class="brand-sub">Vozni red uživo</div>
        </div>
        <div class="live-clock" id="listClock"><span class="dot"></span><span></span></div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Pretraži liniju ili mjesto…" autocomplete="off">
      </div>
    </div>
    <div class="section-label">Linije</div>
    <div class="line-list" id="lineList"></div>
    <div class="footer-note" id="footerNote">Podaci o vožnji temelje se na objavljenom voznom redu prijevoznika. Provjerite ploču na stajalištu prije putovanja.</div>
  </div>

  <!-- ===================== DETAIL VIEW ===================== -->
  <div id="detail-view" style="display:none;">
    <div class="topbar">
      <div class="backbtn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Sve linije
        <div class="live-clock" id="detailClock" style="margin-left:12px;"><span class="dot"></span><span></span></div>
      </div>
      <div class="detail-header">
        <div class="detail-badge"><span id="detailBadge"></span></div>
        <div class="detail-title">
          <div id="detailTitle"></div>
          <small id="detailSub"></small>
        </div>
      </div>
      <div class="live-card">
        <div class="live-left">
          <div class="lbl"><span class="dot"></span> SLJEDEĆI POLAZAK</div>
          <div class="desc" id="liveDesc">—</div>
        </div>
        <div class="flap-row" id="flapRow"></div>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>
    <div class="date-select">
      <label for="dateInput">Pregled za</label>
      <input type="date" id="dateInput">
      <span id="dateWeekday" class="weekday-label"></span>
    </div>
    <div id="routePanels"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* SiMBus v2
   JS je namjerno tanak: Supabase odlučuje sezonu, dan i polaske.
   Baza je jedini izvor istine; ovdje samo dohvaćamo i crtamo podatke.
*/
const DAY_LABELS = ["Pon","Uto","Sri","Čet","Pet","Sub","Ned"];
const SUPABASE_URL = 'https://vdawvqirjwlzvjzijhyd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2vQX9TolrGkdl2hlOHSG4g_NAKuHKUb';

let db = null;
let LINES = [];
let currentLine = null;
let currentDir = 'polazak';
let currentRun = null;
let selectedDate = new Date();
let currentTimetable = [];
let flapInterval = null;

const lineListEl = document.getElementById('lineList');
const searchInput = document.getElementById('searchInput');
const listView = document.getElementById('list-view');
const detailView = document.getElementById('detail-view');
const dateInputEl = document.getElementById('dateInput');
const dateWeekdayEl = document.getElementById('dateWeekday');

function pad(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isToday(d){ const n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate(); }
function isoDay(d){ return d.getDay()===0 ? 7 : d.getDay(); }
function timeMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function dayLabel(days){
  const names=[];
  ['PON','UTO','SRI','ČET','PET','SUB','NED'].forEach((n,i)=>{ if(days[i]) names.push(n); });
  if(names.length===7) return 'Svaki dan';
  if(names.length===5 && names.slice(0,5).every((_,i)=>days[i]) && !days[5] && !days[6]) return 'Radnim danom (Pon–Pet)';
  return names.join(', ');
}
function fmtRelative(next){
  if(!next) return '—';
  if(next.offset===0) return next.time;
  if(next.offset===1) return 'sutra ' + next.time;
  return DAY_LABELS[(isoDay(new Date())-1+next.offset)%7] + ' ' + next.time;
}
function lineDisplayName(line){
  if(!line) return '—';

  const title = (line.title || '').trim();
  const genericTitle = `Linija ${line.code}`.toLowerCase();
  const hasMeaningfulTitle = title && title.toLowerCase() !== genericTitle;

  // Za kružne linije (ili kad je u title već spremljen puni naziv trase)
  // title ima prednost, npr. "GLINA – BREZOVO POLJE – GLINA".
  if(line.is_circular || hasMeaningfulTitle){
    return title || line.from_name || `Linija ${line.code}`;
  }

  const a = line.from_name || '—';
  const b = line.to_name || '';
  return b ? `${a} – ${b}` : a;
}

function directionLabel(dir){
  if(currentLine?.is_circular){
    return lineDisplayName(currentLine);
  }

  const a = currentLine.from_name || currentLine.title || '—';
  const b = currentLine.to_name || '—';

  return dir === 'polazak'
    ? `${a} → ${b}`
    : `${b} → ${a}`;
}

async function initDB(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){ throw new Error('Nisu upisani Supabase URL i anon ključ.'); }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const {data,error}=await db.from('lines').select('id,code,title,from_name,to_name,is_circular').order('code');
  if(error) throw error;
  LINES=data||[];
}

async function loadNextDepartures(){
  const now=new Date();
  const {data,error}=await db.rpc('get_lines_with_next_departure',{p_date:toISODate(now),p_now:`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`});
  if(error) throw error;
  return data||[];
}

async function loadTimetable(lineId,date,dir){
  const {data,error}=await db.rpc('get_line_timetable',{p_line_id:lineId,p_date:toISODate(date),p_direction:dir});
  if(error) throw error;
  return data||[];
}

async function loadServiceStatus(lineId,date,dir){
  const {data,error}=await db.rpc('get_line_service_status',{p_line_id:lineId,p_date:toISODate(date),p_direction:dir});
  if(error) throw error;
  return (data||[])[0]||null;
}

function formatHrServiceDate(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const weekday=['nedjelja','ponedjeljak','utorak','srijeda','četvrtak','petak','subota'][dt.getDay()];
  return `${weekday}, ${d}.${m}.${y}.`;
}

function refreshDateUI(){
  dateInputEl.value=toISODate(selectedDate);
  dateWeekdayEl.textContent=isToday(selectedDate)?'Danas':DAY_LABELS[isoDay(selectedDate)-1];
  dateWeekdayEl.classList.toggle('is-today',isToday(selectedDate));
}

dateInputEl.addEventListener('change',async()=>{
  if(!dateInputEl.value) return;
  const [y,m,d]=dateInputEl.value.split('-').map(Number);
  selectedDate=new Date(y,m-1,d);
  currentRun=null;
  await renderDetail();
});

document.getElementById('backBtn').addEventListener('click',()=>{
  detailView.style.display='none';
  listView.style.display='block';
  if(flapInterval) clearInterval(flapInterval);
});

async function renderList(filter=''){
  lineListEl.innerHTML=`<div class="empty-state"><p>Učitavanje…</p></div>`;
  try{
    const nexts=await loadNextDepartures();
    const byId=new Map(nexts.map(x=>[x.line_id,x]));
    const f=filter.trim().toLowerCase();
    const rows=LINES.filter(l=>{ const hay=[l.code,lineDisplayName(l),l.title,l.from_name,l.to_name].filter(Boolean).join(' ').toLowerCase(); return !f||hay.includes(f); });
    lineListEl.innerHTML=rows.map(line=>{
      const n=byId.get(line.id);
      return `<div class="line-card" data-line="${line.id}">
        <div class="line-badge">${line.code}</div>
        <div class="line-info">
          <div class="line-route">${lineDisplayName(line)}</div>
          <div class="line-meta">${n?.stop_count||0} stajališta${line.is_circular?' · kružna':''}</div>
        </div>
        <div class="line-next"><span class="lbl">Sljedeći</span><span class="val ${n?.next_time?'':'off'}">${n?.next_time||'—'}</span></div>
      </div>`;
    }).join('')||`<div class="empty-state"><p>Nema linija koje odgovaraju pretrazi.</p></div>`;
    lineListEl.querySelectorAll('.line-card').forEach(card=>card.addEventListener('click',()=>openDetail(Number(card.dataset.line))));
  }catch(e){
    console.error(e);
    lineListEl.innerHTML=`<div class="empty-state error-state"><p>Greška pri dohvaćanju podataka.</p><small style="display:block;margin-top:8px;word-break:break-word;">${e?.message||String(e)}</small></div>`;
  }
}
searchInput.addEventListener('input',()=>renderList(searchInput.value));

async function openDetail(lineId){
  currentLine=LINES.find(x=>x.id===lineId);
  if(!currentLine) return;
  currentDir='polazak';
  currentRun=null;
  selectedDate=new Date();
  refreshDateUI();
  listView.style.display='none';
  detailView.style.display='block';
  document.getElementById('detailBadge').textContent=currentLine.code;
  document.getElementById('detailTitle').textContent=lineDisplayName(currentLine);
  document.getElementById('detailSub').textContent=currentLine.is_circular?'Kružna linija':'Vozni red';
  await renderDetail();
  if(flapInterval) clearInterval(flapInterval);
  flapInterval=setInterval(()=>{ if(currentLine) renderLiveCard(); },15000);
}

async function renderDetail(){
  if(!currentLine) return;
  refreshDateUI();
  const allDirs=['polazak','povratak'];
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=allDirs.map(d=>`<div class="tab ${d===currentDir?'active':''}" data-dir="${d}">${d==='polazak'?'Polazak':'Povratak'}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',async()=>{
    currentDir=t.dataset.dir;
    currentRun=null;
    await renderDetail();
  }));
  [currentTimetable,currentServiceStatus]=await Promise.all([
    loadTimetable(currentLine.id,selectedDate,currentDir),
    loadServiceStatus(currentLine.id,selectedDate,currentDir)
  ]);
  if(currentRun){
    const found=currentTimetable.find(x=>String(x.departure_id)===String(currentRun.departure_id));
    currentRun=found||null;
  }
  if(currentRun) renderRunDetail(); else renderRunList();
  await renderLiveCard();
}

function renderRunList(){
  const panel=document.getElementById('routePanels');
  const active=currentTimetable;
  const dateLabel=`${selectedDate.getDate()}.${selectedDate.getMonth()+1}.${selectedDate.getFullYear()}.`;
  const today=isToday(selectedDate);
  const cards=active.map(run=>{
    const stops=run.stops||[];
    const valid=stops.filter(s=>s.time);
    const first=valid[0],last=valid[valid.length-1];
    return `<div class="run-card ${today?'today':''}" data-run="${run.departure_id}">
      <div class="run-time-badge">${first?.time||'—'}</div>
      <div class="run-info">
        <div class="run-route">${run.route_name || ((first?.name||'—') + ' → ' + (last?.name||'—'))} <span style="color:var(--muted);font-weight:500;">· dolazak ${last?.time||'—'}</span></div>
        <div class="run-meta"><span class="run-days-label">Vrijedi za ${DAY_LABELS[isoDay(selectedDate)-1]} · ${dateLabel}</span>${today?'<span class="run-today-chip">Danas</span>':''}</div>
      </div>
      <svg class="run-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`;
  }).join('');
  const status=currentServiceStatus;
  let noService='';
  if(!active.length){
    const reason=status?.message ? `<span class="no-service-reason">${status.message}</span>` : '';
    const next=status?.next_service_date
      ? `<span class="no-service-next">Sljedeći dan prometovanja je ${formatHrServiceDate(status.next_service_date)}${status.next_service_time?` u ${String(status.next_service_time).slice(0,5)}`:''}.</span>`
      : '';
    noService=`<div class="no-service-banner">🚫 Linija ${currentLine.code} ne prometuje ${today?'danas':`na ${dateLabel}`} u ovom smjeru.${reason}${next}</div>`;
  }
  panel.innerHTML=`${noService}<div class="run-list-head">Odaberi polazak za prikaz stanica i vremena</div><div class="run-list">${cards}</div>`;
  panel.querySelectorAll('.run-card').forEach(card=>card.addEventListener('click',()=>{
    currentRun=active.find(x=>String(x.departure_id)===card.dataset.run);
    renderRunDetail();
  }));
}

function renderRunDetail(){
  const run=currentRun;
  const panel=document.getElementById('routePanels');
  const stops=run?.stops||[];
  const now=new Date();
  const live=isToday(selectedDate);
  const nowMin=now.getHours()*60+now.getMinutes();
  const valid=stops.filter(s=>s.time);
  const first=valid[0],last=valid[valid.length-1];
  const rows=stops.map((s,i)=>{
    const m=timeMinutes(s.time);
    const past=live&&m!==null&&m<=nowMin;
    const next=live&&m!==null&&m>nowMin&&valid.findIndex(v=>v.time===s.time)===valid.findIndex(v=>v.time===s.time);
    return `<div class="stop-row"><div class="stop-name-col"><div class="stop-name ${i===0||i===stops.length-1?'endpoint':''}">${s.name}</div>${s.km!=null?`<div class="stop-km">${s.km} km</div>`:''}${s.note?`<div class="stop-note">${s.note}</div>`:''}</div><div class="stop-times"><div class="time-chip ${next?'highlight':''} ${past?'past':''}">${s.time||'–'}</div></div></div>`;
  }).join('');
  const dots=stops.map((s,i)=>`<div style="height:52px;display:flex;align-items:center;"><div class="stop-dot"></div></div>`).join('');
  panel.innerHTML=`<div class="run-detail-head"><div class="run-back" id="runBack"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Svi polasci</div></div><div class="route-panel" style="margin-top:8px;"><div class="route-panel-head"><div><div class="run-summary-title">${first?.time||'—'} · ${run.route_name || ((first?.name||currentLine.from_name||'—') + ' → ' + (last?.name||currentLine.to_name||'—'))}</div><span>${isToday(selectedDate)?'Vozi danas':'Vozni red za '+selectedDate.getDate()+'.'+(selectedDate.getMonth()+1)+'.'+selectedDate.getFullYear()+'.'}</span></div></div><div class="route-body"><div class="rail-col" id="railCol"><div class="rail-line"></div>${dots}</div><div style="flex:1;">${rows}</div></div></div>`;
  document.getElementById('runBack').addEventListener('click',()=>{currentRun=null;renderRunList();});
}

async function renderLiveCard(){
  if(!currentLine) return;
  try{
    const now=new Date();
    const {data,error}=await db.rpc('get_lines_with_next_departure',{p_date:toISODate(now),p_now:`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`});
    if(error) throw error;
    const n=(data||[]).find(x=>x.line_id===currentLine.id);
    document.getElementById('liveDesc').textContent=n?.next_time ? directionLabel(n.next_direction) : 'Nema više polazaka';
    renderFlap(n?.next_time||'--:--');
  }catch(e){ console.error(e); }
}
function renderFlap(t){
  const el=document.getElementById('flapRow'); el.innerHTML='';
  t.split('').forEach(ch=>{const x=document.createElement('div');x.className='flap'+(ch===':'?' colon':'');x.textContent=ch;el.appendChild(x);});
}

function tickClock(){
  const d=new Date(),label=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.querySelectorAll('#listClock span:last-child,#detailClock span:last-child').forEach(x=>x.textContent=label);
}
tickClock();setInterval(tickClock,1000);
setInterval(()=>{if(listView.style.display!=='none') renderList(searchInput.value);},30000);

(async function(){
  lineListEl.innerHTML='<div class="empty-state"><p>Učitavanje voznog reda iz baze…</p></div>';
  try{
    await initDB();
    renderList();
    document.getElementById('footerNote').innerHTML+=' <br><span style="opacity:.7;">Izvor podataka: Supabase baza</span>';
  }catch(e){
    console.error(e);
    lineListEl.innerHTML=`<div class="empty-state error-state"><p>Greška pri dohvaćanju podataka.</p><small style="display:block;margin-top:8px;word-break:break-word;">${e?.message||String(e)}</small></div>`;
  }
})();
</script>
</body>
</html>
